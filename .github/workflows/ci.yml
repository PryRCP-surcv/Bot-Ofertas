name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_NO_PROGRESS: "1"
  PYTHONUTF8: "1"
  TELEGRAM_ENABLED: "false"

jobs:
  quality:
    name: Ruff and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Ruff
        run: uv run --no-sync ruff check .

      - name: Unit tests
        run: uv run --no-sync pytest -q -p no:cacheprovider tests/unit

  dashboard:
    name: Dashboard lint, types, build and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Production build and tests
        run: npm test

  postgres:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      POSTGRES_DB: bot_ofertas_ci
      POSTGRES_USER: bot_ofertas_ci
      POSTGRES_PASSWORD: ci-only-ephemeral-password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      RUN_POSTGRES_TESTS: "1"

    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: bot_ofertas_ci
          POSTGRES_USER: bot_ofertas_ci
          POSTGRES_PASSWORD: ci-only-ephemeral-password
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bot_ofertas_ci -d bot_ofertas_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 10s

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify lock file
        run: uv lock --check

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Apply migrations to an empty database
        run: uv run --no-sync alembic upgrade head

      - name: Verify models and migrations agree
        run: uv run --no-sync alembic check

      - name: PostgreSQL integration tests
        run: uv run --no-sync pytest -q -p no:cacheprovider tests/integration

      - name: Show PostgreSQL logs on failure
        if: failure()
        run: docker logs "${{ job.services.postgres.id }}"
