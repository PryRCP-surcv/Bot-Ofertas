[project]
name = "bot-ofertas"
version = "0.1.0"
description = "Monitor responsable de precios y ofertas en tiendas online de Peru"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "fastapi>=0.139,<0.140",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.1,<2",
  "scrapy>=2.17,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.51,<0.52",
]

[project.scripts]
bot-ofertas = "bot_ofertas.cli:main"
bot-ofertas-api = "bot_ofertas.api.main:main"

[dependency-groups]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=8,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bot_ofertas"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requiere servicios externos locales como PostgreSQL",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
